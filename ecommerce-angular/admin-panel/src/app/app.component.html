<div class="app-layout d-flex" style="min-height: 100vh;">
    
    <!-- Sidebar 20% -->
    <div class="sidebar-wrapper" 
         *ngIf="isAuthenticated()" 
         style="width: 20%; flex: 0 0 20%;">
        <app-side-bar></app-side-bar>
    </div>
    
    <!-- Contenido 80% -->
    <div class="content-wrapper" 
         style="width: 80%; flex: 1 1 80%; min-height: 100vh;">
        
        <div class="card content-card shadow-sm border-0 rounded-0 d-flex flex-column" 
             style="min-height: 100vh; background: transparent; border: none;">

            <div class="content card-body flex-grow-1 d-flex align-items-center justify-content-center">
                <router-outlet></router-outlet>
            </div>
        </div>
    </div>
</div>
