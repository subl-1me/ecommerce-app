<div class="store-container">
  <!-- Hero / Cover -->
  <div class="hero-section position-relative">
    <img
      src="../../../assets/cover/01.jpg"
      class="cover-image w-100"
      alt="Cover"
    />
    <div
      class="hero-overlay position-absolute top-0 start-0 w-100 h-100 d-flex flex-column justify-content-center align-items-center text-center text-white"
    >
      <h1 class="display-3 fw-bold mb-3 hero-title">Discover Your Style</h1>
      <p class="lead mb-4 hero-subtitle">
        New arrivals for the upcoming season
      </p>
      <button
        class="btn btn-hero rounded-pill px-5 py-3"
        [routerLink]="['/products']"
      >
        Shop Now
      </button>
    </div>
  </div>

  <!-- categories component -->
  <app-category-shower [config]="config"></app-category-shower>

  <app-latests-products
    [latestProducts]="latestProducts"
  ></app-latests-products>

  <!-- Trending Products -->
  <app-trending-products
    [trendingProducts]="topSellers"
  ></app-trending-products>

  <!-- App Section -->
  <div class="app-section py-5">
    <div class="container">
      <div class="row align-items-center justify-content-center g-4">
        <div class="col-12 col-md-4 text-center">
          <img
            src="../../../assets/smartphone-illustration.png"
            class="app-illustration"
            alt="Smartphone"
          />
        </div>
        <div class="col-12 col-md-6 text-center text-md-start">
          <h2 class="app-title mb-3">Enjoy our products in your smartphone!</h2>
          <p class="app-subtitle mb-4">
            Download our app and shop anytime, anywhere
          </p>
          <img
            src="../../../assets/icons/downloadAt.jpg"
            class="app-download"
            alt="Download"
          />
        </div>
      </div>
    </div>
  </div>
</div>
