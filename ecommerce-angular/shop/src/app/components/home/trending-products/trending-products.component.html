<div class="trending-section py-5">
  <div class="container">
    <div class="text-center mb-5">
      <div class="d-flex justify-content-center align-items-center gap-3 mb-2">
        <img
          src="../../../assets/trending-illustration.png"
          class="section-illustration"
          alt="Trending"
        />
        <div class="text-start">
          <h2 class="section-title mb-0">Trending Products</h2>
          <p class="section-subtitle mb-0">Check out our best sellers</p>
        </div>
      </div>
    </div>

    <div class="row justify-content-center g-4">
      <ng-container *ngFor="let product of trendingProducts">
        <div class="col-6 col-md-4 col-lg-3">
          <div
            class="product-card trending-card"
            [routerLink]="['/products/detail/', product._id]"
          >
            <div class="product-image-wrapper">
              <img
                [src]="product.gallery[0].path"
                class="product-image"
                alt="{{ product.title }}"
              />
              <span class="product-badge trending-badge">Hot</span>
            </div>
            <div class="product-info p-3">
              <p class="product-title mb-1">{{ product.title }}</p>
              <p class="product-price mb-0">${{ product.price }}</p>
            </div>
          </div>
        </div>
      </ng-container>
    </div>

    <div class="text-center mt-5">
      <button
        class="btn btn-explore-trending rounded-pill px-5 py-3"
        [routerLink]="['/products']"
      >
        Explore More
      </button>
    </div>
  </div>
</div>
