<aside class="profile-sidebar">
  <!-- Card de usuario -->
  <div class="user-card">
    <div class="avatar-wrapper">
      <div class="avatar-circle">
        <span
          >{{ customer.names?.charAt(0) || "U"
          }}{{ customer.surnames?.charAt(0) || "" }}</span
        >
      </div>
    </div>

    <div class="user-info" *ngIf="customer.names && customer.email">
      <h5 class="user-name">{{ customer.names }} {{ customer.surnames }}</h5>
      <p class="user-email">{{ customer.email }}</p>
    </div>

    <div class="user-loading" *ngIf="!customer.names || !customer.email">
      <div class="loading-line"></div>
      <div class="loading-line short"></div>
    </div>
  </div>
