        <div class="filters-sidebar">
          <div class="filter-header">
            <h5 class="mb-0">Filters</h5>
            <span class="filter-count">{{ products.length }} items</span>
          </div>

          <app-categories-card
            (filteredProducts)="onFilterByCategory($event)"
          ></app-categories-card>
          <!-- Price -->
          <div class="filter-card">
            <h6 class="filter-title">Price Range</h6>
            <form #priceForm="ngForm" (ngSubmit)="onSubmit()">
              <div class="row g-2">
                <div class="col-6">
                  <label for="minPrice" class="price-label">Min</label>
                  <div class="input-group">
                    <span class="input-group-text">$</span>
                    <input
                      type="number"
                      class="form-control"
                      id="minPrice"
                      name="min"
                      [(ngModel)]="min"
                      placeholder="0"
                    />
                  </div>
                </div>
                <div class="col-6">
                  <label for="maxPrice" class="price-label">Max</label>
                  <div class="input-group">
                    <span class="input-group-text">$</span>
                    <input
                      type="number"
                      class="form-control"
                      id="maxPrice"
                      name="max"
                      [(ngModel)]="max"
                      placeholder="999"
                    />
                  </div>
                </div>
              </div>
              <button
                type="submit"
                class="btn btn-filter w-100 mt-3"
                [disabled]="products.length == 0"
              >
                Apply Filter
              </button>
            </form>
          </div>
        </div>
      </aside>

      <!-- Products Section -->
      <main class="col-12 col-lg-9">
        <!-- Toolbar -->
        <div class="toolbar">
          <div class="toolbar-item">
            <label class="toolbar-label">Sort by</label>
            <select
              class="form-select form-select-sm toolbar-select"
              aria-label="Sort products"
              name="sortByOption"
              [(ngModel)]="sortByOption"
              (change)="sortBy()"
            >
              <option value="default">Default</option>
              <option value="popularity">Popularity</option>
              <option value="lowestPrice">Lowest Price</option>
              <option value="highestPrice">Highest Price</option>
            </select>
          </div>

          <div class="toolbar-item">
            <label class="toolbar-label">Show</label>
            <input
              type="number"
              class="form-control form-control-sm toolbar-input"
              id="inputShow"
              name="productsAmount"
              [(ngModel)]="productsAmount"
              (change)="showAmount()"
              min="1"
            />
          </div>

          <div *ngIf="totalProductsMessage" class="toolbar-message">
            {{ totalProductsMessage }}
          </div>
        </div>

        <!-- Products Grid -->
        <div class="products-grid">
          <!-- Empty State -->
          <div class="empty-state" *ngIf="products.length === 0">
            <img
              src="../../../../assets/no-data-illustration.png"
              class="empty-illustration"
              alt="No data"
            />
            <h5 class="empty-title">No products available</h5>
            <p class="empty-subtitle">New sales coming soon</p>
          </div>

          <!-- Product Cards -->
          <div class="row g-3">
            <div
              class="col-12 col-sm-6 col-lg-4"
              *ngFor="let product of products"
            >
              <div class="product-card">
                <div
                  class="product-image-wrapper"
                  [routerLink]="['/products/detail', product._id]"
                >
                  <img
                    [src]="product.gallery[0].path"
                    class="product-image"
                    alt="{{ product.title }}"
                  />
                  <span class="product-overlay">View Details</span>
                </div>

                <div class="product-body">
                  <h6 class="product-title">{{ product.title }}</h6>
                  <p class="product-price">${{ product.price }}</p>

                  <button
                    class="btn btn-add-cart"
                    (click)="addToCart(product._id)"
                  >
                    <fa-icon [icon]="faCartShopping" class="me-1"></fa-icon>
                    Add to Cart
                  </button>

                  <div class="cart-message" *ngIf="addToCartMesssage !== ''">
                    {{ addToCartMesssage }}
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
</div>
