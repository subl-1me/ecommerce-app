<div class="product-card">
  <div
    class="product-image-wrapper"
    [routerLink]="['/products/detail', product._id]"
  >
    <img
      [src]="product.gallery[0].path"
      class="product-image"
      alt="{{ product.slug }}"
    />
    <span class="product-overlay">View Details</span>
  </div>

  <div class="product-body">
    <h6 class="product-title">{{ product.slug }}</h6>
    <p class="product-price">${{ product.price }}</p>

    <!-- Colors -->
    <div
      class="variant-block"
      *ngIf="getProductColorVariants(product).length > 0"
    >
      <span class="variant-label">Colors</span>
      <div class="variant-swatches">
        <button
          *ngFor="let color of getProductColorVariants(product)"
          type="button"
          class="variant-swatch"
          [style.background]="color.meta.hex"
          [attr.aria-label]="color.label"
          [title]="color.label"
        ></button>
      </div>
    </div>

    <!-- Sizes -->
    <div
      class="variant-block"
      *ngIf="getProductSizeVariants(product).length > 0"
    >
      <span class="variant-label">Sizes</span>
      <div class="variant-chips">
        <button
          *ngFor="let size of getProductSizeVariants(product)"
          type="button"
          class="variant-chip"
        >
          {{ size.label }}
        </button>
      </div>
    </div>

    <button class="btn btn-add-cart" (click)="addToCart(product._id)">
      <fa-icon [icon]="faCartShopping" class="me-1"></fa-icon>
      Add to Cart
    </button>

    <button
      class="btn btn-favorite mt-2"
      (click)="addToWishlist(product._id)"
      *ngIf="!isOnWishlist(product._id)"
    >
      Add to Wishlist
    </button>
    <button
      class="btn btn-favorite-active mt-2"
      (click)="removeFromWishlist(product._id)"
      *ngIf="isOnWishlist(product._id)"
    >
      Remove from Wishlist
    </button>
  </div>
</div>
