<div class="filter-card">
  <h6 class="filter-title">Categories</h6>

  <div class="search-wrapper">
    <input
      type="text"
      placeholder="Search category"
      name="searchParam"
      [(ngModel)]="searchParam"
      class="form-control search-input"
      name="filterCategory"
      (keyup)="searchCategory($event)"
    />
    <span class="search-icon">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="14"
        height="14"
        fill="currentColor"
        viewBox="0 0 16 16"
      >
        <path
          d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"
        />
      </svg>
    </span>
  </div>

  <!-- <div *ngIf="noItemsFoundMessage !== ''" class="filter-empty-msg">
    No products found with that search
  </div> -->

  <ul class="category-list mt-3">
    <li class="category-item">
      <label class="category-label">
        <input
          type="checkbox"
          class="form-check-input"
          (click)="reloadList()"
        />
        <span class="category-name ms-2">Show All</span>
      </label>
    </li>
    <hr style="opacity: 5%" />
    <ng-container *ngFor="let category of categoriesAux">
      <li class="category-item">
        <label class="category-label" [for]="category">
          <input
            type="checkbox"
            class="form-check-input"
            [id]="category"
            (click)="getProductsByCategory(category.toString())"
          />
          <span class="category-name">{{ category }}</span>
        </label>
      </li>
    </ng-container>
  </ul>
</div>
