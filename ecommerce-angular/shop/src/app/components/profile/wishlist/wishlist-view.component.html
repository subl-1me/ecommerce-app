<div class="order-detail-container">
  <div class="container py-5">
    <div class="row g-4">
      <!-- Sidebar -->
      <aside class="col-12 col-lg-3">
        <app-profile-list-group></app-profile-list-group>
      </aside>

      <!-- Main -->
      <main class="col-12 col-lg-9">
        <div class="wishlist-container">
          <div class="container">
            <!-- Header -->
            <div class="wishlist-header">
              <div class="d-flex align-items-center gap-3">
                <div class="header-icon">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="22"
                    height="22"
                    fill="currentColor"
                    viewBox="0 0 16 16"
                  >
                    <path
                      d="m8 2.748-.717-.737C5.6.281 2.514.878 1.4 3.053c-.523 1.023-.641 2.5.314 4.385.92 1.815 2.834 3.989 6.286 6.357 3.452-2.368 5.365-4.542 6.286-6.357.955-1.886.837-3.362.314-4.385C13.486.878 10.4.28 8.717 2.01L8 2.748zM8 15C-7.333 4.868 3.279-3.04 7.824 1.143c.06.055.119.112.176.171a3.12 3.12 0 0 1 .176-.17C12.72-3.042 23.333 4.867 8 15z"
                    />
                  </svg>
                </div>
                <div>
                  <h1 class="page-title">My Wishlist</h1>
                  <p class="page-subtitle">Products you've saved for later</p>
                </div>
              </div>
              <span class="header-badge" *ngIf="wishlist.length > 0">
                {{ wishlist.length }}
                {{ wishlist.length === 1 ? "item" : "items" }}
              </span>
            </div>

            <!-- Empty state -->
            <div class="empty-state" *ngIf="wishlist.length === 0">
              <div class="empty-icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="42"
                  height="42"
                  fill="currentColor"
                  viewBox="0 0 16 16"
                >
                  <path
                    d="m8 2.748-.717-.737C5.6.281 2.514.878 1.4 3.053c-.523 1.023-.641 2.5.314 4.385.92 1.815 2.834 3.989 6.286 6.357 3.452-2.368 5.365-4.542 6.286-6.357.955-1.886.837-3.362.314-4.385C13.486.878 10.4.28 8.717 2.01L8 2.748zM8 15C-7.333 4.868 3.279-3.04 7.824 1.143c.06.055.119.112.176.171a3.12 3.12 0 0 1 .176-.17C12.72-3.042 23.333 4.867 8 15z"
                  />
                </svg>
              </div>
              <h5 class="empty-title">Your wishlist is empty</h5>
              <p class="empty-subtitle">
                Save your favorite products to see them here
              </p>
              <a class="btn-browse" [routerLink]="['/products']"
                >Browse Products</a
              >
            </div>

            <!-- Wishlist grid -->
            <div class="row g-4" *ngIf="wishlist.length > 0">
              <div
                class="col-12 col-sm-6 col-md-4 col-lg-3"
                *ngFor="let product of wishlist"
              >
                <div class="wishlist-card">
                  <!-- Image -->
                  <div class="wishlist-image-wrapper">
                    <img
                      [src]="product.gallery?.[0]?.path"
                      class="wishlist-image"
                      alt="{{ product.slug }}"
                    />
                    <span
                      class="wishlist-overlay"
                      [routerLink]="['/products/detail/', product._id]"
                      >View Details</span
                    >

                    <!-- Remove button -->
                    <button
                      class="wishlist-remove-btn"
                      title="Remove from wishlist"
                      aria-label="Remove from wishlist"
                      (click)="removeFromWishlist(product._id)"
                    >
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="14"
                        height="14"
                        fill="currentColor"
                        viewBox="0 0 16 16"
                      >
                        <path
                          d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"
                        />
                        <path
                          d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"
                        />
                      </svg>
                    </button>
                  </div>

                  <!-- Body -->
                  <div class="wishlist-body">
                    <h6 class="wishlist-title">{{ product.slug }}</h6>
                    <p class="wishlist-price">${{ product.price }}</p>

                    <button class="btn-add-to-cart">
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="14"
                        height="14"
                        fill="currentColor"
                        viewBox="0 0 16 16"
                      >
                        <path
                          d="M0 1.5A.5.5 0 0 1 .5 1H2a.5.5 0 0 1 .485.379L2.89 3H14.5a.5.5 0 0 1 .49.598l-1 5a.5.5 0 0 1-.465.401l-9.397.472L4.415 11H13a.5.5 0 0 1 0 1H4a.5.5 0 0 1-.491-.408L2.01 3.607 1.61 2H.5a.5.5 0 0 1-.5-.5zM3.102 4l.84 4.479 9.144-.459L13.89 4H3.102zM5 12a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm7 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4zm-7 1a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm7 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"
                        />
                      </svg>
                      Add to Cart
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <!-- Footer actions -->
            <div class="wishlist-footer" *ngIf="wishlist.length > 0">
              <a class="btn-continue-shopping" [routerLink]="['/products']">
                Continue Shopping
              </a>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
</div>
