<div class="profile-container">
  <div class="container py-5">
    <div class="row g-4 justify-content-center">
      <!-- Sidebar -->
      <aside class="col-12 col-lg-3">
        <app-profile-list-group></app-profile-list-group>
      </aside>

      <!-- Main -->
      <main class="col-12 col-lg-9">
        <div class="profile-header">
          <h1 class="profile-title">My Profile</h1>
          <p class="profile-subtitle">
            Manage your account and delivery information
          </p>
        </div>

        <form
          #settingsForm="ngForm"
          (ngSubmit)="onSubmit()"
          class="profile-form"
        >
          <!-- Account -->
          <div class="form-card">
            <div class="form-card-header">
              <div class="section-icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  fill="currentColor"
                  viewBox="0 0 16 16"
                >
                  <path
                    d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4zm-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664h10z"
                  />
                </svg>
              </div>
              <div>
                <h4 class="form-card-title">Account</h4>
                <p class="form-card-subtitle">Your personal information</p>
              </div>
            </div>

            <div class="row g-3">
              <div class="col-12 col-md-6">
                <label for="names" class="form-label">Names</label>
                <input
                  type="text"
                  class="form-control form-control-custom"
                  id="names"
                  name="names"
                  [(ngModel)]="customer.names"
                  placeholder="Your names"
                />
              </div>

              <div class="col-12 col-md-6">
                <label for="surnames" class="form-label">Surnames</label>
                <input
                  type="text"
                  class="form-control form-control-custom"
                  id="surnames"
                  name="surnames"
                  [(ngModel)]="customer.surnames"
                  placeholder="Your surnames"
                />
              </div>

              <div class="col-12 col-md-6">
                <label for="email" class="form-label">Email</label>
                <input
                  type="email"
                  class="form-control form-control-custom is-readonly"
                  id="email"
                  readonly
                  disabled
                  name="email"
                  [(ngModel)]="customer.email"
                />
                <small class="form-hint">Email cannot be changed</small>
              </div>

              <div class="col-12 col-md-6">
                <label for="gender" class="form-label">Gender</label>
                <input
                  type="text"
                  class="form-control form-control-custom"
                  id="gender"
                  name="gender"
                  [(ngModel)]="customer.gender"
                  placeholder="Your gender"
                />
              </div>
            </div>
          </div>

          <!-- Delivery -->
          <div class="form-card">
            <div class="form-card-header">
              <div class="section-icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  fill="currentColor"
                  viewBox="0 0 16 16"
                >
                  <path
                    d="M0 3.5A1.5 1.5 0 0 1 1.5 2h9A1.5 1.5 0 0 1 12 3.5V5h1.02a1.5 1.5 0 0 1 1.17.563l1.481 1.85a1.5 1.5 0 0 1 .329.938V10.5a1.5 1.5 0 0 1-1.5 1.5H14a2 2 0 1 1-4 0H5a2 2 0 1 1-3.998-.085A1.5 1.5 0 0 1 0 10.5v-7zm1.294 7.456A1.999 1.999 0 0 1 4.732 11h5.536a2.01 2.01 0 0 1 .732-.732V3.5a.5.5 0 0 0-.5-.5h-9a.5.5 0 0 0-.5.5v7a.5.5 0 0 0 .5.5h.026z"
                  />
                </svg>
              </div>
              <div>
                <h4 class="form-card-title">Delivery Information</h4>
                <p class="form-card-subtitle">
                  Where we should send your orders
                </p>
              </div>
            </div>

            <div class="row g-3">
              <div class="col-12 col-md-6">
                <label for="dni" class="form-label">DNI</label>
                <input
                  type="text"
                  class="form-control form-control-custom"
                  id="dni"
                  name="dni"
                  [(ngModel)]="customer.dni"
                  placeholder="Your ID number"
                />
              </div>

              <div class="col-12 col-md-6">
                <label for="birthday" class="form-label">Birthday</label>
                <input
                  type="date"
                  class="form-control form-control-custom"
                  id="birthday"
                  name="birthday"
                  [(ngModel)]="customer.birthday"
                />
              </div>

              <div class="col-12 col-md-6">
                <label for="country" class="form-label">Country</label>
                <input
                  type="text"
                  class="form-control form-control-custom"
                  id="country"
                  name="country"
                  [(ngModel)]="customer.country"
                  placeholder="Your country"
                />
              </div>

              <div class="col-12 col-md-6">
                <label for="city" class="form-label">City</label>
                <input
                  type="text"
                  class="form-control form-control-custom"
                  id="city"
                  name="city"
                  [(ngModel)]="customer.city"
                  placeholder="Your city"
                />
              </div>

              <div class="col-12 col-md-6">
                <label for="phone" class="form-label">Phone</label>
                <input
                  type="tel"
                  class="form-control form-control-custom"
                  id="phone"
                  name="phone"
                  [(ngModel)]="customer.phone"
                  placeholder="(000) 000-0000"
                />
              </div>
            </div>
          </div>

          <!-- Actions -->
          <div class="form-actions">
            <ng-container *ngIf="editMessage === ''">
              <button type="submit" class="btn btn-save">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  fill="currentColor"
                  viewBox="0 0 16 16"
                >
                  <path
                    d="M2 1a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H9.5a1 1 0 0 0-1 1v4.5a1 1 0 0 1-1 1H3.5a1 1 0 0 1 0-2H7V2a1 1 0 0 1 1-1H2z"
                  />
                </svg>
                Save Changes
              </button>
            </ng-container>

            <ng-container *ngIf="editMessage === 'Saved!'">
              <button type="submit" disabled class="btn btn-saved">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  fill="currentColor"
                  viewBox="0 0 16 16"
                >
                  <path
                    d="M10.97 4.97a.75.75 0 0 1 1.07 1.05l-3.99 4.99a.75.75 0 0 1-1.08.02L4.324 8.384a.75.75 0 1 1 1.06-1.06l2.094 2.093 3.473-4.425a.267.267 0 0 1 .02-.022z"
                  />
                </svg>
                {{ editMessage }}
              </button>
            </ng-container>

            <ng-container *ngIf="editMessage !== '' && editMessage != 'Saved!'">
              <button type="submit" disabled class="btn btn-error">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  fill="currentColor"
                  viewBox="0 0 16 16"
                >
                  <path
                    d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8 2.146 2.854Z"
                  />
                </svg>
                {{ editMessage }}
              </button>
            </ng-container>
          </div>
        </form>
      </main>
    </div>
  </div>
</div>
