<div class="profile-container">
  <div class="container py-5">
    <div class="row g-4 justify-content-center">
      <!-- Sidebar -->
      <aside class="col-12 col-lg-3">
        <app-profile-list-group></app-profile-list-group>
      </aside>

      <!-- Main -->
      <main class="col-12 col-lg-9">
        <div class="profile-header">
          <h1 class="profile-title">My Profile</h1>
          <p class="profile-subtitle">
            Manage your account and delivery information
          </p>
        </div>

        <form
          #settingsForm="ngForm"
          (ngSubmit)="onSubmit()"
          class="profile-form"
        >
          <!-- Account -->
          <div class="form-card">
            <div class="form-card-header">
              <div class="section-icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  fill="currentColor"
                  viewBox="0 0 16 16"
                >
                  <path
                    d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0zm4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4zm-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10c-2.29 0-3.516.68-4.168 1.332-.678.678-.83 1.418-.832 1.664h10z"
                  />
                </svg>
              </div>
              <div>
                <h4 class="form-card-title">Account</h4>
                <p class="form-card-subtitle">Your personal information</p>
              </div>
            </div>

            <div class="row g-3">
              <div class="col-12 col-md-3">
                <label for="username" class="form-label">Username</label>
                <input
                  type="text"
                  class="form-control form-control-custom"
                  id="username"
                  name="username"
                  [(ngModel)]="customer.username"
                  placeholder="@user"
                />
              </div>

              <div class="col-12 col-md-3">
                <label for="names" class="form-label">Names</label>
                <input
                  type="text"
                  class="form-control form-control-custom"
                  id="names"
                  name="names"
                  [(ngModel)]="customer.names"
                  placeholder="Your names"
                />
              </div>

              <div class="col-12 col-md-3">
                <label for="surnames" class="form-label">Surnames</label>
                <input
                  type="text"
                  class="form-control form-control-custom"
                  id="surnames"
                  name="surnames"
                  [(ngModel)]="customer.surnames"
                  placeholder="Your surnames"
                />
              </div>

              <div class="col-12 col-md-3">
                <label for="email" class="form-label">Email</label>
                <input
                  type="email"
                  class="form-control form-control-custom is-readonly"
                  id="email"
                  readonly
                  disabled
                  name="email"
                  [(ngModel)]="customer.email"
                />
                <small class="form-hint">Email cannot be changed</small>
              </div>

              <div class="col-12 col-md-6">
                <label for="country" class="form-label">Country</label>
                <input
                  type="text"
                  class="form-control form-control-custom"
                  id="country"
                  name="country"
                  [(ngModel)]="customer.country"
                  placeholder="Your country"
                />
              </div>

              <div class="col-12 col-md-6">
                <label for="language" class="form-label">Language</label>
                <select
                  class="form-control form-control-custom"
                  id="language"
                  name="language"
                  [(ngModel)]="customer.language"
                >
                  <option value="es">Español</option>
                  <option value="en">English</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Change Password -->
          <div class="form-card">
            <div class="form-card-header">
              <div class="section-icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="18"
                  height="18"
                  fill="currentColor"
                  viewBox="0 0 16 16"
                >
                  <path
                    d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2zM5 8h6a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"
                  />
                </svg>
              </div>
              <div>
                <h4 class="form-card-title">Change Password</h4>
                <p class="form-card-subtitle">Keep your account secure</p>
              </div>
            </div>

            <div class="row g-3">
              <div class="col-12 col-md-4">
                <label for="currentPassword" class="form-label"
                  >Current Password</label
                >
                <input
                  type="password"
                  class="form-control form-control-custom"
                  id="currentPassword"
                  name="currentPassword"
                  [(ngModel)]="customer.password"
                  placeholder="Enter current password"
                />
              </div>

              <div class="col-12 col-md-4">
                <label for="newPassword" class="form-label">New Password</label>
                <input
                  type="password"
                  class="form-control form-control-custom"
                  id="newPassword"
                  name="newPassword"
                  [(ngModel)]="newPassword"
                  placeholder="Enter new password"
                />
                <small class="form-hint">Minimum 8 characters</small>
              </div>

              <div class="col-12 col-md-4">
                <label for="confirmPassword" class="form-label"
                  >Confirm Password</label
                >
                <input
                  type="password"
                  class="form-control form-control-custom"
                  id="confirmPassword"
                  name="confirmPassword"
                  [(ngModel)]="confirmPassword"
                  placeholder="Repeat new password"
                />
              </div>
            </div>

            <div class="password-actions">
              <button type="button" class="btn btn-change-password">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  fill="currentColor"
                  viewBox="0 0 16 16"
                >
                  <path
                    d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2zM5 8h6a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"
                  />
                </svg>
                Update Password
              </button>
            </div>
          </div>

          <!-- Actions -->
          <div class="form-actions">
            <ng-container *ngIf="editMessage === ''">
              <button type="submit" class="btn btn-save">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  fill="currentColor"
                  viewBox="0 0 16 16"
                >
                  <path
                    d="M2 1a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H9.5a1 1 0 0 0-1 1v4.5a1 1 0 0 1-1 1H3.5a1 1 0 0 1 0-2H7V2a1 1 0 0 1 1-1H2z"
                  />
                </svg>
                Save Changes
              </button>
            </ng-container>

            <ng-container *ngIf="editMessage === 'Saved!'">
              <button type="submit" disabled class="btn btn-saved">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  fill="currentColor"
                  viewBox="0 0 16 16"
                >
                  <path
                    d="M10.97 4.97a.75.75 0 0 1 1.07 1.05l-3.99 4.99a.75.75 0 0 1-1.08.02L4.324 8.384a.75.75 0 1 1 1.06-1.06l2.094 2.093 3.473-4.425a.267.267 0 0 1 .02-.022z"
                  />
                </svg>
                {{ editMessage }}
              </button>
            </ng-container>

            <ng-container *ngIf="editMessage !== '' && editMessage != 'Saved!'">
              <button type="submit" disabled class="btn btn-error">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  fill="currentColor"
                  viewBox="0 0 16 16"
                >
                  <path
                    d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8 2.146 2.854Z"
                  />
                </svg>
                {{ editMessage }}
              </button>
            </ng-container>
          </div>
        </form>
      </main>
    </div>
  </div>
</div>
