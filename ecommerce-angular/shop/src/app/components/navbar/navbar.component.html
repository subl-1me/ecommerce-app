<div class="navbar-wrapper">
  <nav class="navbar navbar-expand-lg navbar-custom p-0">
    <div class="container">
      <!-- Brand -->
      <a
        class="navbar-brand d-flex align-items-center gap-2"
        [routerLink]="['/']"
      >
        <div class="brand-icon">
          <span>{{ config.shopName[0] }}</span>
        </div>
        <span class="brand-name">{{ config.shopName }}</span>
      </a>

      <!-- Mobile toggler -->
      <button
        class="navbar-toggler border-0 shadow-none"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarContent"
        aria-controls="navbarContent"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Navbar content -->
      <div class="collapse navbar-collapse" id="navbarContent">
        <!-- Left nav -->
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link nav-link-custom" [routerLink]="['/']">Home</a>
          </li>

          <li class="nav-item dropdown">
            <a
              class="nav-link nav-link-custom dropdown-toggle"
              href="#"
              id="productsDropdown"
              role="button"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              Products
            </a>
            <ul
              class="dropdown-menu dropdown-custom"
              aria-labelledby="productsDropdown"
            >
              <li>
                <a
                  class="dropdown-item dropdown-item-custom"
                  [routerLink]="['/products']"
                >
                  Show All
                </a>
              </li>
              <li><hr class="dropdown-divider" /></li>
              <ng-container *ngFor="let category of categories">
                <li>
                  <a
                    class="dropdown-item dropdown-item-custom"
                    href="#"
                    [routerLink]="['/products', category]"
                    (click)="updatedBreadcrumb()"
                  >
                    {{ category }}
                  </a>
                </li>
              </ng-container>
            </ul>
          </li>

          <li class="nav-item">
            <a class="nav-link nav-link-custom" [routerLink]="['/contact']"
              >Contact</a
            >
          </li>
        </ul>

        <!-- Right side -->
        <ul class="navbar-nav align-items-center gap-2">
          <!-- Search -->
          <li class="nav-item">
            <div class="search-wrapper">
              <input
                class="search-input form-control"
                type="search"
                placeholder="Search for products..."
                aria-label="Search"
              />
              <span class="search-icon">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  fill="currentColor"
                  viewBox="0 0 16 16"
                >
                  <path
                    d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"
                  />
                </svg>
              </span>
            </div>
          </li>

          <!-- Login / User -->
          <li class="nav-item">
            <a
              *ngIf="!customer.names && !customer.surnames"
              [routerLink]="['/login']"
              class="nav-link nav-link-custom guest-link"
            >
              <fa-icon [icon]="faUser" class="me-1"></fa-icon>
              <span>Log in</span>
            </a>

            <div class="dropdown" *ngIf="customer.names && customer.surnames">
              <a
                class="nav-link nav-link-custom dropdown-toggle user-link"
                href="#"
                id="userDropdown"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                <span class="avatar-circle">
                  <fa-icon [icon]="faUser"></fa-icon>
                </span>
                <span class="user-name"
                  >{{ customer.names }} {{ customer.surnames }}</span
                >
              </a>
              <ul
                class="dropdown-menu dropdown-custom dropdown-menu-end"
                aria-labelledby="userDropdown"
              >
                <li>
                  <a
                    class="dropdown-item dropdown-item-custom"
                    href="#"
                    [routerLink]="['/profile', _idStorage]"
                    (click)="updatedBreadcrumb()"
                  >
                    <fa-icon [icon]="faUser" class="me-2"></fa-icon>
                    Profile
                  </a>
                </li>
                <li><hr class="dropdown-divider" /></li>
                <li>
                  <a
                    class="dropdown-item dropdown-item-custom text-danger"
                    href="#"
                    (click)="logOut()"
                  >
                    <fa-icon
                      [icon]="faArrowRightFromBracket"
                      class="me-2"
                    ></fa-icon>
                    Log Out
                  </a>
                </li>
              </ul>
            </div>
          </li>

          <!-- Wishlist -->
          <li class="nav-item">
            <div class="dropdown">
              <a
                class="nav-link nav-link-custom icon-link dropdown-toggle"
                href="#"
                id="wishlistDropdown"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                <span class="icon-wrapper">
                  <fa-icon [icon]="faHeart"></fa-icon>
                  <span class="badge-count" *ngIf="productsFav.length > 0">{{
                    productsFav.length
                  }}</span>
                </span>
              </a>
              <ul
                class="dropdown-menu dropdown-custom dropdown-menu-end favs-menu"
                aria-labelledby="wishlistDropdown"
              >
                <app-wishlist></app-wishlist>
              </ul>
            </div>
          </li>

          <!-- Cart -->
          <li class="nav-item">
            <a class="nav-link nav-link-custom icon-link" (click)="openCart()">
              <span class="icon-wrapper">
                <fa-icon [icon]="faCartShopping"></fa-icon>
                <span class="badge-count cart-badge">0</span>
              </span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</div>
