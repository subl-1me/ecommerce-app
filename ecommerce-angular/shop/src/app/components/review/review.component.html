<div class="review-container">
  <div class="review-card">
    <div class="row g-4 align-items-center">
      <!-- Ilustración -->
      <div class="col-12 col-lg-5">
        <div class="illustration-side">
          <div class="illustration-wrapper">
            <img
              src="../../../assets/review-illustration.jpg"
              class="review-illustration"
              alt="Review illustration"
            />
          </div>
          <h4 class="illustration-title">Tell us what you think</h4>
          <p class="illustration-subtitle">
            Your feedback helps other customers make better decisions
          </p>
        </div>
      </div>

      <!-- Formulario -->
      <div class="col-12 col-lg-7">
        <form
          #reviewForm="ngForm"
          (ngSubmit)="submitReview(reviewForm)"
          class="review-form"
        >
          <div class="form-group">
            <label class="form-label">Your Rating</label>
            <div class="rating-wrapper">
              <form [formGroup]="form" id="rating">
                <ngx-star-rating formControlName="rating"></ngx-star-rating>
              </form>
              <span class="rating-value">
                {{ form.value.rating || 0 }} / 5
              </span>
            </div>
          </div>

          <div class="form-group">
            <label for="content" class="form-label">Your Review</label>
            <textarea
              id="content"
              class="form-control form-control-custom"
              rows="5"
              placeholder="Share your experience with this product..."
              name="content"
              [(ngModel)]="review.content"
              required
            ></textarea>
          </div>

          <button
            type="submit"
            class="btn btn-submit"
            [disabled]="reviewForm.invalid"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="14"
              height="14"
              fill="currentColor"
              viewBox="0 0 16 16"
            >
              <path
                d="M15.854.146a.5.5 0 0 1 .11.54l-5.819 14.547a.75.75 0 0 1-1.329.124l-3.178-4.995L.643 7.184a.75.75 0 0 1 .124-1.33L15.314.037a.5.5 0 0 1 .54.11ZM6.636 10.07l2.761 4.338L14.13 2.576 6.636 10.07Zm6.787-8.201L1.591 6.602l4.339 2.76 7.494-7.493Z"
              />
            </svg>
            Send Review
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
